# Geometría: CAD 3D en el navegador. Todo se calcula en el navegador:
# el servidor solo entrega la página (sin backend, sin base de datos, sin subidas).
#
#  - Solo se entra por https://10.8.0.20:4380 (la VPN), con el certificado de la CA de casa.
#  - Sin estado en el servidor: las piezas se guardan en el navegador de cada equipo.
services:
  geometria:
    build: .
    image: geometria:local
    container_name: geometria
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10.8.0.20:4380:4380"
    volumes:
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=700
      - /data:uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    # El binario de Caddy trae esta capacidad marcada; sin ella no arranca
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
