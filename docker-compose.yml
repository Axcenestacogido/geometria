# Geometría: CAD 3D en el navegador. Todo se calcula en el navegador.
#
#  - Solo se entra por https://10.8.0.20:4380 (la VPN), con el certificado de la CA de casa.
#  - «geometria» entrega la página y pasa /api/ a «geometria-datos», que guarda las piezas
#    en ./datos (/srv/apps/geometria/datos: entra en la copia nocturna, que copia todo /srv). Este segundo contenedor no
#    tiene puertos y está en una red interna sin internet: solo le llega Caddy.
services:
  geometria:
    build: .
    image: geometria:local
    container_name: geometria
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10.8.0.20:4380:4380"
    networks: [default, interna]
    depends_on: [geometria-datos]
    volumes:
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=700
      - /data:uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    # El binario de Caddy trae esta capacidad marcada; sin ella no arranca
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  geometria-datos:
    build: ./server
    image: geometria-datos:local
    container_name: geometria-datos
    restart: unless-stopped
    user: "1000:1000"
    networks: [interna]
    volumes:
      - ./datos:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      MAX_TOTAL: "2147483648"
      TRASH_DAYS: "30"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # sin salida a internet: solo para que Caddy hable con geometria-datos
  interna:
    internal: true
